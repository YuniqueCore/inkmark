name: Native toolchain
description: Install verified NSH and consume the shared offline document
inputs:
  sdk:
    description: Optional embedding SDK (android or ios)
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: '24'
    - uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: '1.3.14'
    - run: bun install --frozen-lockfile
      shell: bash
    - uses: actions/download-artifact@v8.0.2
      with:
        name: native-inputs
        path: .
    - run: node scripts/native-setup.mjs
      shell: bash
    - if: inputs.sdk != ''
      run: node scripts/native-setup.mjs "$NATIVE_SDK"
      shell: bash
      env:
        NATIVE_SDK: ${{ inputs.sdk }}
