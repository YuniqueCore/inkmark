name: Native toolchain
description: Install verified NSH and consume the shared offline document
inputs:
  sdk:
    description: Optional embedding SDK (android or ios)
    default: ''
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v5.2.8
    - uses: ./.github/actions/javascript
    - uses: actions/download-artifact@v8.0.2
      with:
        name: native-inputs
        path: .
    # Cache only immutable release archives. Setup still verifies SHA-256 and extracts fresh SDKs.
    - name: Cache verified NSH archives
      uses: actions/cache@v6.1.0
      with:
        path: .local-build/nsh/downloads
        key: nsh-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.sdk || 'desktop' }}-${{ hashFiles('native/toolchain.json') }}
    - run: node scripts/native-setup.mjs
      shell: bash
    - if: inputs.sdk != ''
      run: node scripts/native-setup.mjs "$NATIVE_SDK"
      shell: bash
      env:
        NATIVE_SDK: ${{ inputs.sdk }}
