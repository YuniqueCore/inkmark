name: JavaScript toolchain
description: Install locked dependencies using a platform-scoped Bun package cache
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: '24'
    - uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: '1.3.14'
    - name: Cache Bun packages
      uses: actions/cache@v6.1.0
      with:
        path: ${{ runner.temp }}/inkmark-bun-packages
        key: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
        restore-keys: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-1.3.14-
    - name: Install locked dependencies
      run: bun install --frozen-lockfile
      shell: bash
      env:
        BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/inkmark-bun-packages
