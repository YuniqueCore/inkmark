name: Verify, package and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive # 词库来自 natural-talk 子模块
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install browser for business regression tests
        run: bunx playwright install --with-deps chrome
      - name: Typecheck, unit tests and browser workflows
        run: bun run check
      - name: Build (typecheck + vite, /inkmark/ base)
        run: bun run build:pages
      - name: Build shared offline native document
        run: bun run build:native-web
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-inputs
          include-hidden-files: true
          path: |
            .local-build/native-web/index.html
            native/generated
            native/desktop/nsh.json
            native/mobile/nsh.json
      - uses: actions/configure-pages@v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist

  native:
    needs: build
    uses: ./.github/workflows/native.yml
    permissions:
      contents: read

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
