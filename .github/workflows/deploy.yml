name: Verify, package and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native_target:
        description: Native platforms to build and test
        type: choice
        options: [all, macos, linux, windows, android, ios]
        default: all
      deploy_pages:
        description: Deploy static Pages after verification (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.event_name }}-${{ github.ref }}-${{ inputs.native_target || 'all' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive # 词库来自 natural-talk 子模块
          fetch-depth: 0 # Release/install-counter checks use the published tag baseline.
      - uses: ./.github/actions/javascript
      - name: Check product version and native install counter
        run: node scripts/release-version.ts check
      - name: Install browser for business regression tests
        run: bunx playwright install --with-deps chrome
      - name: Typecheck, unit tests and browser workflows
        run: bun run check
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: web-tests
          path: test-results/
          if-no-files-found: ignore
      - name: Build (typecheck + vite, /inkmark/ base)
        run: bun run build:pages
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-inputs
          include-hidden-files: true
          path: |
            .local-build/native-web/index.html
            native/generated
            native/desktop/nsh.json
            native/mobile/nsh.json
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy_pages)
        with:
          path: dist

  native:
    needs: build
    uses: ./.github/workflows/native.yml
    with:
      target: ${{ inputs.native_target || 'all' }}
    permissions:
      contents: read

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy_pages)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/javascript
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Advance the native install counter in the release PR
        if: steps.release.outputs.prs_created == 'true'
        run: node scripts/release-version.ts prepare-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
      - uses: actions/download-artifact@v8.0.2
        if: steps.release.outputs.release_created == 'true'
        with:
          pattern: InkMark-*
          path: .local-build/release-inputs
      - name: Attach verified applications and publish the complete release
        if: steps.release.outputs.release_created == 'true'
        run: node scripts/publish-release.ts --run "$DELIVERY_RUN" --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELIVERY_RUN: ${{ github.run_id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SOURCE: ${{ steps.release.outputs.sha }}
