plugins { id 'com.android.application' }

def product = new groovy.json.JsonSlurper().parse(rootProject.file('../../package.json'))
def nativeProduct = new groovy.json.JsonSlurper().parse(rootProject.file('../product.json'))
android {
    namespace = 'io.github.yuniquecore.inkmark'
    compileSdk = 37
    buildToolsVersion = '37.0.0'
    defaultConfig {
        applicationId = nativeProduct.id
        minSdk = 26
        targetSdk = 37
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        versionCode = nativeProduct.build
        versionName = product.version
    }
    buildTypes {
        release { minifyEnabled = true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') }
    }
    sourceSets.main.assets.srcDirs += ['../../generated/mobile-assets']
    sourceSets.main.res.srcDirs += ['../../generated/icons/android/res']
    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
    lint { warningsAsErrors = true; abortOnError = true }
}
dependencies {
    implementation files('../../../.local-build/nsh/sdk/embed-android/nsh-embed-android/nsh.aar')
    implementation 'androidx.activity:activity:1.13.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.1'
}
