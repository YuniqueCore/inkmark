<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InkMark · 文字与图片批注工作台</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      // 防闪烁：首帧前应用阅读偏好里的主题（键与 ui/prefs.ts 镜像——改动必须两处同步）
      ;(() => {
        const DARK_THEMES = ['dark', 'panda-inverse']
        let theme = null
        try {
          const raw = JSON.parse(localStorage.getItem('inkmark:prefs:v1') || 'null')
          if (raw && ['light', 'sepia', 'dark', 'panda', 'panda-inverse'].includes(raw.theme)) theme = raw.theme
        } catch {}
        if (!theme) {
          const legacy = localStorage.getItem('inkmark:theme')
          theme = legacy === 'light' || legacy === 'dark'
            ? legacy
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        }
        document.documentElement.dataset.theme = theme
        if (DARK_THEMES.includes(theme)) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body class="flex h-dvh flex-col overflow-hidden">
    <header class="workbench-toolbar">
      <button id="btn-tree-drawer" class="btn btn-ghost toolbar-icon" aria-label="文档导航" aria-expanded="true" title="显示或隐藏文档导航"></button>
      <div class="document-heading"><span id="document-title">InkMark</span><span id="document-detail">文字与图片批注</span></div>
      <div id="reading-toolbar" class="reading-switch" role="group" aria-label="文档视图" hidden>
        <button type="button" data-reading-mode="source" aria-pressed="true">原文</button>
        <button type="button" data-reading-mode="split" aria-pressed="false">分栏</button>
        <button type="button" data-reading-mode="preview" aria-pressed="false">预览</button>
      </div>
      <button id="btn-sidebar-drawer" class="btn btn-ghost toolbar-icon" aria-label="批注列表" aria-expanded="true" title="显示或隐藏批注列表"></button>
      <button id="btn-export" class="btn btn-default btn-sm toolbar-export" title="导出批注（⌘S）">导出</button>
      <button id="btn-more" class="btn btn-ghost toolbar-icon" aria-label="更多操作" aria-haspopup="menu" aria-expanded="false"></button>
      <input id="workspace-input" type="file" accept=".json,application/json" hidden />
      <input id="file-input" type="file" accept=".txt,.md,.markdown,.json,.png,.jpg,.jpeg,.webp" multiple hidden />
      <input id="folder-input" type="file" webkitdirectory multiple hidden />
    </header>

    <div id="legacy-recovery" class="flex shrink-0 flex-wrap items-center gap-2 border-b bg-muted px-4 py-2 text-xs text-muted-foreground" role="status" hidden>
      <span class="flex-1">旧版工作区数据已保留。请关闭旧标签页；下载后可用「打开文件」合并文档，或从更多菜单恢复完整工作区。</span>
      <button id="btn-legacy-backup" type="button" class="btn btn-outline btn-sm">下载旧版数据</button>
    </div>
    <main id="layout" class="flex min-h-0 flex-1 overflow-hidden">
      <aside id="documents-pane" class="theme-side document-pane" aria-label="文档导航">
        <div class="pane-heading"><span>文档</span><button id="btn-import" class="btn btn-ghost toolbar-icon" title="新建或导入文档" aria-label="新建或导入文档" aria-haspopup="menu" aria-expanded="false"></button></div>
        <div id="filetree" class="min-h-0 flex-1 overflow-y-auto" aria-label="文档树"></div>
        <button id="btn-trash" class="btn btn-ghost library-trash">回收站 <span id="trash-count"></span></button>
      </aside>
      <div id="handle-left" class="resize-handle shrink-0 max-lg:hidden" role="separator" aria-orientation="vertical"></div>
      <div id="editor-wrap" class="relative min-w-0 flex-1">
        <section id="image-view" class="image-view" aria-label="图片批注区" hidden></section>
        <div id="reading-panes" class="reading-panes" data-layout="source">
          <section id="editor" class="editor reading-pane overflow-y-auto px-4 py-6 sm:px-12 sm:py-10" aria-label="批注文本区"></section>
          <section id="markdown-preview" class="reading-pane markdown-preview overflow-y-auto px-4 py-6 sm:px-10 sm:py-10" aria-label="Markdown 预览" tabindex="0" hidden>
            <article class="markdown-body"></article>
          </section>
        </div>

      </div>
      <div id="handle-right" class="resize-handle shrink-0 max-lg:hidden" role="separator" aria-orientation="vertical"></div>
      <aside id="sidebar" class="theme-side shrink-0 overflow-y-auto p-4" style="width: var(--side-w, 340px)" aria-label="批注列表"></aside>
    </main>

    <footer class="workbench-status">
      <span id="save-status" role="status" aria-live="polite"><span id="save-dot" class="size-1.5 rounded-full bg-emerald-500"></span><span id="save-text">正在载入</span></span>
      <span id="preview-hint" class="reading-hint" hidden>预览可划选批注 · 图片点击加载</span>
      <span id="diff-stats" class="hidden"></span>
      <a href="https://github.com/YuniqueCore/inkmark" target="_blank" rel="noreferrer" aria-label="InkMark GitHub"><span id="app-version"></span></a>
    </footer>
    <div id="save-error" class="save-error" role="alert" hidden>
      <p>自动保存失败，请检查浏览器存储；关闭页面前可下载完整工作区备份（含原图和回收站，不含未提交草稿）；刷新后可从更多菜单恢复。</p>
      <button id="btn-recovery-backup" type="button" class="btn btn-outline btn-sm mt-2">下载备份</button>
      <button id="btn-raw-backup" type="button" class="btn btn-outline btn-sm mt-2" hidden>下载无法解析的原始数据</button>
      <button id="btn-reset-storage" type="button" class="btn btn-outline btn-sm mt-2" hidden>用当前文档重置本地数据</button>
    </div>
    <div id="drawer-backdrop" class="fixed inset-x-0 bottom-0 top-[53px] z-30 hidden bg-black/40 lg:hidden" aria-hidden="true"></div>
    <div id="overlay" class="fixed inset-0 z-90 hidden bg-black/50 backdrop-blur-[2px]"></div>
    <div id="export-modal" class="hidden" role="dialog" aria-modal="true" aria-label="导出批注"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
