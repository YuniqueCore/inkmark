<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InkMark · 文字与图片批注工作台</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      // 防闪烁：首帧前应用阅读偏好里的主题（键与 ui/prefs.ts 镜像——改动必须两处同步）
      ;(() => {
        const DARK_THEMES = ['dark', 'panda-inverse']
        let theme = null
        try {
          const raw = JSON.parse(localStorage.getItem('inkmark:prefs:v1') || 'null')
          if (raw && ['light', 'sepia', 'dark', 'panda', 'panda-inverse'].includes(raw.theme)) theme = raw.theme
        } catch {}
        if (!theme) {
          const legacy = localStorage.getItem('inkmark:theme')
          theme = legacy === 'light' || legacy === 'dark'
            ? legacy
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        }
        document.documentElement.dataset.theme = theme
        if (DARK_THEMES.includes(theme)) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body class="flex h-dvh flex-col overflow-hidden">
    <header class="sticky top-0 z-20 shrink-0 border-b bg-card/80 backdrop-blur-md">
      <div class="flex h-14 items-center justify-between gap-2 px-2 sm:gap-3 sm:px-4">
        <div class="flex items-center gap-1.5">
          <button id="btn-tree-drawer" class="btn btn-ghost btn-sm lg:hidden" title="文档树抽屉" aria-label="文档树抽屉">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
          </button>
          <button id="btn-sidebar-drawer" class="btn btn-ghost btn-sm lg:hidden" title="批注栏抽屉" aria-label="批注栏抽屉">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>
          </button>
          <span class="hidden text-[17px] font-semibold tracking-tight sm:inline">InkMark</span>
          <span class="hidden text-[12.5px] text-muted-foreground lg:inline">文字与图片批注工作台</span>
          <span id="app-version" class="hidden shrink-0 text-[11px] leading-none text-muted-foreground/60 lg:inline"></span>
        </div>
        <div class="flex items-center gap-1.5">
          <span id="save-status" class="mr-1 flex shrink-0 items-center gap-1.5 text-xs text-muted-foreground max-[399px]:hidden" title="自动保存到本地浏览器" role="status" aria-live="polite">
            <span id="save-dot" class="size-1.5 rounded-full bg-emerald-500"></span><span id="save-text" class="hidden sm:inline">正在载入</span>
          </span>
          <button id="btn-import" class="btn btn-ghost btn-sm" title="导入：打开文件 / 导入文件夹 / 载入示例" aria-haspopup="menu" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
            <span class="hidden lg:inline">导入</span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden size-3 lg:inline opacity-60"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <button id="btn-scan" class="btn btn-outline btn-sm" title="用 anti-slop 词库预扫描套话，生成候选批注">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/></svg>
            <span class="hidden lg:inline">slop 预扫描</span>
          </button>
          <button id="btn-search" class="btn btn-ghost btn-sm" title="搜索与批量批注（⌘F）" aria-label="搜索与批量批注">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/></svg>
            <span class="hidden lg:inline">搜索</span>
          </button>
          <button id="btn-trash" class="btn btn-ghost btn-sm relative" title="回收站：删除的文档与批注保留 7 天，可恢复" aria-label="回收站">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            <span class="hidden lg:inline">回收站</span>
            <span id="trash-count" class="hidden" aria-hidden="true"></span>
          </button>
          <span class="mx-1 hidden h-5 w-px bg-border sm:block"></span>
          <button id="btn-edit" class="btn btn-outline btn-sm" title="编辑原文：直接修改规范文本，完成后批注按引文自动重锚">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
            <span class="hidden lg:inline">编辑原文</span>
          </button>
          <button id="btn-diff" class="btn btn-outline btn-sm hidden sm:inline-flex" title="对照 AI 改稿：贴入改稿生成原文 vs 改稿 diff，两侧均可划选写批注">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M11 18H8a2 2 0 0 1-2-2V9"/></svg>
            <span class="hidden lg:inline">对照</span>
          </button>
          <span id="diff-stats" class="hidden font-mono text-xs text-muted-foreground" title="改稿新增 / 删除行数"></span>
          <button id="btn-diff-clear" class="btn btn-ghost btn-sm btn-destructive hidden" title="清除 AI 改稿（原文与批注保留）">清除改稿</button>
          <button id="btn-export" class="btn btn-default btn-sm" title="导出批注（⌘S）">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
            <span class="hidden lg:inline">导出</span>
          </button>
          <span class="mx-1 hidden h-5 w-px bg-border sm:block"></span>
          <button id="btn-theme" class="btn btn-ghost btn-sm" title="切换明暗主题" aria-label="切换主题"></button>
          <button id="btn-view" class="btn btn-ghost btn-sm" title="视图：明暗 / 阅读设置 / 批注栏" aria-haspopup="menu" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>
            <span class="hidden lg:inline">视图</span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden size-3 lg:inline opacity-60"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <a
            href="https://github.com/YuniqueCore/inkmark"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-ghost btn-sm max-sm:hidden"
            title="GitHub 仓库（点个 Star 支持一下）"
            aria-label="GitHub 仓库"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
            <span class="hidden lg:inline">GitHub</span>
          </a>
          <button id="btn-more" class="btn btn-ghost btn-sm" title="更多：移除文档" aria-haspopup="menu" aria-expanded="false" aria-label="更多">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
          </button>
        </div>
        <input id="workspace-input" type="file" accept=".json,application/json" hidden />
        <input id="file-input" type="file" accept=".txt,.md,.markdown,.json,text/plain,image/png,image/jpeg,image/webp" multiple hidden />
        <input id="folder-input" type="file" webkitdirectory hidden />
      </div>
    </header>

    <div id="legacy-recovery" class="flex shrink-0 flex-wrap items-center gap-2 border-b bg-muted px-4 py-2 text-xs text-muted-foreground" role="status" hidden>
      <span class="flex-1">旧版工作区数据已保留。请关闭旧标签页；下载后可用「打开文件」合并文档，或从更多菜单恢复完整工作区。</span>
      <button id="btn-legacy-backup" type="button" class="btn btn-outline btn-sm">下载旧版数据</button>
    </div>
    <main id="layout" class="flex min-h-0 flex-1 overflow-hidden">
      <aside id="filetree" class="theme-side shrink-0 overflow-y-auto py-2" style="width: var(--tree-w, 240px)" aria-label="文档树"></aside>
      <div id="handle-left" class="resize-handle shrink-0 max-lg:hidden" role="separator" aria-orientation="vertical"></div>
      <div id="editor-wrap" class="relative min-w-0 flex-1">
        <div id="reading-toolbar" class="reading-toolbar" hidden>
          <div class="reading-switch" role="group" aria-label="文档视图">
            <button type="button" data-reading-mode="source" aria-pressed="true">原文</button>
            <button type="button" data-reading-mode="split" aria-pressed="false">分栏</button>
            <button type="button" data-reading-mode="preview" aria-pressed="false">预览</button>
          </div>
          <span id="preview-hint" class="reading-hint" hidden>预览可划选批注 · 图片点击加载</span>
        </div>
        <section id="image-view" class="image-view" aria-label="图片批注区" hidden></section>
        <div id="reading-panes" class="reading-panes" data-layout="source">
          <section id="editor" class="editor reading-pane overflow-y-auto px-4 py-6 sm:px-12 sm:py-10" aria-label="批注文本区"></section>
          <section id="markdown-preview" class="reading-pane markdown-preview overflow-y-auto px-4 py-6 sm:px-10 sm:py-10" aria-label="Markdown 预览" tabindex="0" hidden>
            <article class="markdown-body"></article>
          </section>
        </div>
        <button type="button" id="collapse-left" class="edge-collapse max-lg:hidden" data-collapse="tree" title="收起/展开文档树" aria-label="收起或展开文档树"></button>
        <button type="button" id="collapse-right" class="edge-collapse max-lg:hidden" data-collapse="sidebar" title="收起/展开批注栏" aria-label="收起或展开批注栏"></button>
        <div id="reading-fab"></div>
      </div>
      <div id="handle-right" class="resize-handle shrink-0 max-lg:hidden" role="separator" aria-orientation="vertical"></div>
      <aside id="sidebar" class="theme-side shrink-0 overflow-y-auto p-4" style="width: var(--side-w, 380px)" aria-label="批注列表"></aside>
    </main>

    <div id="save-error" class="save-error" role="alert" hidden>
      <p>自动保存失败，请检查浏览器存储；关闭页面前可下载完整工作区备份（含原图和回收站，不含未提交草稿）；刷新后可从更多菜单恢复。</p>
      <button id="btn-recovery-backup" type="button" class="btn btn-outline btn-sm mt-2">下载备份</button>
      <button id="btn-raw-backup" type="button" class="btn btn-outline btn-sm mt-2" hidden>下载无法解析的原始数据</button>
      <button id="btn-reset-storage" type="button" class="btn btn-outline btn-sm mt-2" hidden>用当前文档重置本地数据</button>
    </div>
    <div id="drawer-backdrop" class="fixed inset-x-0 bottom-0 top-[57px] z-30 hidden bg-black/40 lg:hidden" aria-hidden="true"></div>
    <div id="overlay" class="fixed inset-0 z-90 hidden bg-black/50 backdrop-blur-[2px]"></div>
    <div id="export-modal" class="hidden" role="dialog" aria-modal="true" aria-label="导出批注"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
