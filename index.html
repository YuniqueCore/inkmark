<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InkMark · 划词批注工作台</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      // 防闪烁：首帧前应用阅读偏好里的主题（键与 ui/prefs.ts 镜像——改动必须两处同步）
      ;(() => {
        const DARK_THEMES = ['dark', 'panda-inverse']
        let theme = null
        try {
          const raw = JSON.parse(localStorage.getItem('inkmark:prefs:v1') || 'null')
          if (raw && ['light', 'sepia', 'dark', 'panda', 'panda-inverse'].includes(raw.theme)) theme = raw.theme
        } catch {}
        if (!theme) {
          const legacy = localStorage.getItem('inkmark:theme')
          theme = legacy === 'light' || legacy === 'dark'
            ? legacy
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        }
        document.documentElement.dataset.theme = theme
        if (DARK_THEMES.includes(theme)) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body class="h-full overflow-hidden">
    <header class="sticky top-0 z-20 border-b bg-card/80 backdrop-blur-md">
      <div class="flex h-14 items-center justify-between gap-2 px-2 sm:gap-3 sm:px-4">
        <div class="flex items-center gap-1.5">
          <button id="btn-tree" class="btn btn-ghost btn-sm" title="收起/展开文档树">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
          </button>
          <span class="hidden text-[17px] font-semibold tracking-tight sm:inline">InkMark</span>
          <span class="hidden text-[12.5px] text-muted-foreground lg:inline">划词批注工作台</span>
          <span id="app-version" class="hidden shrink-0 text-[11px] leading-none text-muted-foreground/60 lg:inline"></span>
        </div>
        <div class="flex items-center gap-1.5">
          <span id="save-status" class="mr-1 flex shrink-0 items-center gap-1.5 text-xs text-muted-foreground max-[399px]:hidden" title="自动保存到本地浏览器">
            <span id="save-dot" class="size-1.5 rounded-full bg-emerald-500"></span><span id="save-text" class="hidden sm:inline">已保存</span>
          </span>
          <button id="btn-import-files" class="btn btn-ghost btn-sm" title="导入一个或多个 .txt / .md / 会话 .json">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
            <span class="hidden lg:inline">打开文件</span>
          </button>
          <button id="btn-import-folder" class="btn btn-ghost btn-sm hidden lg:inline-flex" title="导入整个文件夹（.txt / .md）">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><path d="M12 10v6M9 13h6"/></svg>
            文件夹
          </button>
          <span class="mx-1 hidden h-5 w-px bg-border sm:block"></span>
          <button id="btn-sample" class="btn btn-ghost btn-sm hidden lg:inline-flex" title="载入一段带 AI 味的示例文档">示例</button>
          <button id="btn-scan" class="btn btn-outline btn-sm" title="用 anti-slop 词库预扫描套话，生成候选批注">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/></svg>
            <span class="hidden lg:inline">slop 预扫描</span>
          </button>
          <button id="btn-edit" class="btn btn-outline btn-sm" title="编辑原文：直接修改规范文本，完成后批注按引文自动重锚">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
            <span class="hidden lg:inline">编辑原文</span>
          </button>
          <button id="btn-diff" class="btn btn-outline btn-sm" title="对照 AI 改稿：贴入改稿生成原文 vs 改稿 diff，两侧均可划选写批注">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M11 18H8a2 2 0 0 1-2-2V9"/></svg>
            <span class="hidden lg:inline">对照</span>
          </button>
          <span id="diff-stats" class="hidden font-mono text-xs text-muted-foreground" title="改稿新增 / 删除行数"></span>
          <button id="btn-diff-clear" class="btn btn-ghost btn-sm btn-destructive hidden" title="清除 AI 改稿（原文与批注保留）">清除改稿</button>
          <button id="btn-export" class="btn btn-default btn-sm" title="导出批注（⌘S）">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
            <span class="hidden lg:inline">导出</span>
          </button>
          <span class="mx-1 hidden h-5 w-px bg-border sm:block"></span>
          <a
            href="https://github.com/YuniqueCore/inkmark"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-ghost btn-sm"
            title="GitHub 仓库"
            aria-label="GitHub 仓库"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
          </a>
          <button id="btn-theme" class="btn btn-ghost btn-sm" title="切换明暗主题" aria-label="切换主题"></button>
          <button id="btn-sidebar" class="btn btn-ghost btn-sm" title="收起/展开批注栏">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>
          </button>
          <button id="btn-clear" class="btn btn-ghost btn-sm btn-destructive hidden lg:inline-flex" title="移除当前文档">移除</button>
        </div>
        <input id="file-input" type="file" accept=".txt,.md,.markdown,.json,text/plain" multiple hidden />
        <input id="folder-input" type="file" webkitdirectory hidden />
      </div>
    </header>

    <main id="layout" class="flex h-[calc(100vh-57px)] h-[calc(100dvh-57px)] overflow-hidden">
      <aside id="filetree" class="theme-side shrink-0 overflow-y-auto py-2" style="width: var(--tree-w, 240px)" aria-label="文档树"></aside>
      <div id="handle-left" class="resize-handle shrink-0 max-lg:hidden" role="separator" aria-orientation="vertical"></div>
      <div id="editor-wrap" class="relative min-w-0 flex-1">
        <section id="editor" class="editor absolute inset-0 overflow-y-auto px-4 py-6 sm:px-12 sm:py-10" aria-label="批注文本区"></section>
        <div id="reading-fab"></div>
      </div>
      <div id="handle-right" class="resize-handle shrink-0 max-lg:hidden" role="separator" aria-orientation="vertical"></div>
      <aside id="sidebar" class="theme-side shrink-0 overflow-y-auto p-4" style="width: var(--side-w, 380px)" aria-label="批注列表"></aside>
    </main>

    <div id="drawer-backdrop" class="fixed inset-x-0 bottom-0 top-[57px] z-30 hidden bg-black/40 lg:hidden" aria-hidden="true"></div>
    <div id="overlay" class="fixed inset-0 z-90 hidden bg-black/50 backdrop-blur-[2px]"></div>
    <div id="export-modal" class="hidden" role="dialog" aria-modal="true" aria-label="导出批注"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
